name: Wattelier
options:
  bundleIdPrefix: com.n0thytvoff
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: 9P86WD9PWT
    CODE_SIGN_STYLE: Automatic
targets:
  Wattelier:
    type: application
    platform: iOS
    sources:
      - path: Wattelier
        excludes:
          - '**/*.md'
    info:
      path: Wattelier/Support/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n0thytvoff.Wattelier
        PRODUCT_NAME: Wattelier
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - WattelierTests
        - WattelierUITests
      gatherCoverageData: true
  WattelierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WattelierTests
    dependencies:
      - target: Wattelier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n0thytvoff.WattelierTests
        GENERATE_INFOPLIST_FILE: YES
  WattelierUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WattelierUITests
    dependencies:
      - target: Wattelier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n0thytvoff.WattelierUITests
        GENERATE_INFOPLIST_FILE: YES
