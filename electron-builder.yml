appId: io.github.n0thytvoff.wattelier
productName: Wattelier
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
files:
  - desktop/**
  - server/**
  - dist/**
  - package.json
  - LICENSE
  - NOTICE
extraResources:
  - from: build/tray.ico
    to: tray.ico
  - from: build/icon.png
    to: icon.png
directories:
  buildResources: build
  output: release
win:
  icon: build/icon.ico
  executableName: Wattelier
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: Wattelier
  artifactName: Wattelier-Setup-v${version}-${arch}.${ext}
portable:
  artifactName: Wattelier-Portable-v${version}-${arch}.${ext}
  requestExecutionLevel: user
publish:
  provider: github
  owner: N0thyTVOff
  repo: wattelier
  releaseType: release
