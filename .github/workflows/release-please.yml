name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Jeton Release Please non configuré
        if: env.RELEASE_PLEASE_TOKEN == ''
        run: echo 'Ajoutez RELEASE_PLEASE_TOKEN dans les secrets Actions pour automatiser les Release PR.'
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        if: env.RELEASE_PLEASE_TOKEN != ''
        with:
          # Un jeton finement limité permet de garder l'approbation des PR interdite aux workflows.
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
